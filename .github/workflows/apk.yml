name: Gerar APK

on:
  push:
    paths-ignore:
      - '**.md'
      - 'extras/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar chave de assinatura (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinatura.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/assinatura.keystore" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MeusProjetos.apk

      - name: Publicar link de download (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk MeusProjetos.apk \
            --target "$GITHUB_SHA" \
            --title "Meus Projetos — APK mais recente" \
            --notes "Versão 1.0.${GITHUB_RUN_NUMBER} (ramo ${GITHUB_REF_NAME}). Baixe o arquivo MeusProjetos.apk abaixo e abra no celular para instalar."
